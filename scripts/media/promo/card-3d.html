<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easy TikZ 4: 3D</title>
<link rel="stylesheet" href="promo.css">
<style>
    /* The Surface and plane example, turned and with finer sampling (see charts.mjs): the paraboloid
       cut by the plane z = h. Under it the Sliders dock, and the value of h once more in type that
       can be read at the size of a README (the dock's own text is 11 px). */
    .col { width: 584px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    .col .main, .col .dock { width: 584px; }
    .col .value { margin-left: 8px; font-size: 25px; }
</style>
</head>
<body class="card" data-index="6" data-width="1600" data-height="1000">
    <main>
        <section class="copy">
            <h1><span>Surfaces</span><span class="accent">in 3D.</span></h1>
            <p class="lede">Plot z = f(x, y), cut it with planes, add points, arrows and labels. Drag the preview to rotate it. Here a slider moves the plane.</p>
            <div class="pill">z = x^2 + y^2 · plane z = h</div>
        </section>
        <section class="visual">
            <div class="col">
                <div class="shot main" data-shot="plane3d-editor" data-rect="canvas" data-pad="-152,-50,-112,-4"></div>
                <div class="shot is-small dock" data-shot="plane3d-editor" data-rect="dock"></div>
                <div class="cap value">Sliders dock: h = <b data-value="plane3d-editor.h"></b></div>
            </div>
        </section>
    </main>
    <script src="shots/meta.js"></script>
    <script src="promo.js"></script>
</body>
</html>
