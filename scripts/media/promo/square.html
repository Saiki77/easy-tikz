<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easy TikZ 4: square</title>
<link rel="stylesheet" href="promo.css">
<style>
    /* 1080 x 1080: headline on top, the editor on the Linear program example below. */
    body { background: radial-gradient(900px 700px at 50% 74%, #e3e9f3 0%, var(--ground) 72%); }
    .brand { left: 64px; top: 60px; gap: 16px; }
    .brand .mark { width: 52px; height: 52px; }
    .brand .name { font-size: 27px; }
    .crumb.is-top { right: 64px; top: 77px; font-size: 21px; }
    .copy { position: absolute; left: 64px; right: 64px; top: 150px; }
    h1 { font-size: 128px; line-height: 0.95; font-weight: 790; letter-spacing: -0.045em; white-space: nowrap; }
    .lede { margin-top: 24px; font-size: 38px; line-height: 1.3; letter-spacing: -0.015em; color: var(--slate); text-wrap: pretty; }
    .editor { position: absolute; left: 96px; bottom: 60px; width: 888px; border-radius: 16px;
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.1), 0 6px 14px rgba(15, 23, 42, 0.06), 0 36px 70px -24px rgba(15, 23, 42, 0.34); }
</style>
</head>
<body class="square" data-width="1080" data-height="1080">
    <header class="brand">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" rx="9" fill="#0f172a"/>
            <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 28 L31 28"/><path d="M9 28 L9 10"/><path d="M11 24 Q20 -2 29 24"/>
            </g>
        </svg>
        <span class="name">Obsidian plugin</span>
    </header>
    <div class="crumb is-top is-url">github.com/Saiki77/easy-tikz</div>

    <div class="copy">
        <h1>Easy TikZ <span class="accent">4</span></h1>
        <p class="lede">TikZ and pgfplots charts with live sliders, drag to edit and LaTeX export.</p>
    </div>

    <div class="shot editor" data-shot="lp-editor" data-rect="editor"></div>

    <script src="shots/meta.js"></script>
    <script src="promo.js"></script>
</body>
</html>
