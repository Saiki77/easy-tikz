<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easy TikZ 4: charts in notes</title>
<link rel="stylesheet" href="promo.css">
<style>
    /* A note in reading view: the chart with its slider strip, the damping slider k being dragged. */
    .visual .note { width: 772px; }
</style>
</head>
<body class="card" data-index="4" data-width="1600" data-height="1000">
    <main>
        <section class="copy">
            <h1><span>Lives in</span><span class="accent">your notes.</span></h1>
            <p class="lede"><b>Insert into note</b> writes an easy-tikz block. The chart renders in the note with its sliders, and a click opens it in the editor again. No TeX install needed.</p>
            <div class="pill">Sliders never edit the note</div>
        </section>
        <section class="visual">
            <div class="shot note" data-shot="note-wave" data-rect="content" data-pad="30,28,30,30" data-pointer="34"></div>
        </section>
    </main>
    <script src="shots/meta.js"></script>
    <script src="promo.js"></script>
</body>
</html>
