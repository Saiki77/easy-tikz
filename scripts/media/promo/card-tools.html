<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easy TikZ 4: five tools</title>
<link rel="stylesheet" href="promo.css">
<style>
    /* The + Add menu of the editor, one tall list, shown as two crops side by side. */
    .visual .menu { width: 380px; }
    .visual .row { gap: 22px; }
</style>
</head>
<body class="card" data-index="7" data-width="1600" data-height="1000">
    <main>
        <section class="copy">
            <h1><span>Five tools.</span><span class="accent">Not eleven.</span></h1>
            <p class="lede">Region, Curve, Points, Segment and Plane replace the eleven single-purpose tools of 3.x. <b>+ Add</b> lists more than 20 recipes in plain words, so you rarely pick a tool yourself.</p>
            <div class="pill">3.x charts are migrated on open</div>
        </section>
        <section class="visual">
            <div class="row">
                <div class="shot menu" data-shot="lp-add" data-rect="menuTop" data-pointer="34"></div>
                <div class="shot menu" data-shot="lp-add" data-rect="menuBottom"></div>
            </div>
        </section>
    </main>
    <script src="shots/meta.js"></script>
    <script src="promo.js"></script>
</body>
</html>
