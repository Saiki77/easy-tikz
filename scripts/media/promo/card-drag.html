<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easy TikZ 4: drag to edit</title>
<link rel="stylesheet" href="promo.css">
<style>
    /* The preview in the middle of a Shift-drag: ghost of the old line, pivot ring, live tip.
       The tip is shown a second time, enlarged, where the chart is empty. */
    .before { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    .before .tip { width: 452px; }
    .stack { position: relative; }
    .stack .main { width: 776px; }
    /* The copy is cut two px inside the tip (its own border and rounded corners go, with whatever
       chart line passes behind a corner), on a white ground. */
    .lens { position: absolute; right: 26px; top: 26px; width: 372px; border-radius: 16px; background: #ffffff; box-shadow: 0 0 0 2px var(--accent), 0 18px 36px -14px rgba(15, 23, 42, 0.35); }
    .link { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .link line { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; }
</style>
</head>
<body class="card" data-index="1" data-width="1600" data-height="1000">
    <main>
        <section class="copy">
            <h1><span>Drag a line.</span><span class="accent">Numbers follow.</span></h1>
            <p class="lede">Grab a line, curve, point or label in the preview. Easy TikZ rewrites the numbers in its formula, so the shape stays under the pointer. <b>Shift-drag</b> turns a line around its pivot.</p>
            <div class="before">
                <div class="cap">Rest on a shape: the tip says what will change</div>
                <div class="shot is-small tip" data-shot="lp-hover" data-rect="hint" data-pad="-2"></div>
            </div>
        </section>
        <section class="visual">
            <div class="stack">
                <div class="shot main" id="main" data-shot="lp-turn" data-rect="preview" data-pointer="34"></div>
                <div class="shot lens" id="lens" data-shot="lp-turn" data-rect="hint" data-pad="-2"></div>
                <svg class="link" id="link" aria-hidden="true"><line/></svg>
            </div>
        </section>
    </main>
    <script src="shots/meta.js"></script>
    <script src="promo.js"></script>
    <script>
        // A dotted line from the tip in the capture to its enlarged copy.
        (() => {
            const main = document.getElementById('main');
            const tip = window.promo.locate(main, 'hint');
            const stack = main.parentElement.getBoundingClientRect();
            const lens = document.getElementById('lens').getBoundingClientRect();
            const line = document.querySelector('#link line');
            line.setAttribute('x1', String(tip.x + tip.width - stack.left - 4));
            line.setAttribute('y1', String(tip.y - stack.top - 2));
            line.setAttribute('x2', String(lens.left - stack.left + 40));
            line.setAttribute('y2', String(lens.bottom - stack.top + 4));
        })();
    </script>
</body>
</html>
